<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABS Auto Service — Написать нам</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background-color: #000000; }
        .yellow { color: #FFD700; }
        .btn-yellow {
            background-color: #FFD700;
            color: #000000;
            font-weight: 600;
        }
        .btn-yellow:hover {
            background-color: #FFEA00;
        }
    </style>
</head>
<body class="text-white">

    <!-- Шапка -->
    <div class="border-b border-gray-800">
        <div class="max-w-2xl mx-auto px-4 py-6 flex items-center justify-between">
            <div>
                <h1 class="text-3xl font-bold">ABS <span class="yellow">Auto service</span></h1>
                <p class="text-sm text-gray-400">Тюмень</p>
            </div>
            <div class="text-right text-sm">
                <div>8 (3452) 911-977</div>
                <div>8 (922) 40-49-260</div>
            </div>
        </div>
    </div>

    <!-- Основной блок -->
    <div class="max-w-2xl mx-auto px-4 pt-10 pb-16">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold mb-2">Напишите нам</h2>
            <p class="text-gray-400">Оставьте сообщение — мы свяжемся с вами</p>
        </div>

        <!-- Форма -->
        <form id="contactForm" class="space-y-5">
            <div>
                <label class="block text-sm mb-1.5 text-gray-300">Ваше имя</label>
                <input type="text" id="name" required
                       class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-yellow-400">
            </div>

            <div>
                <label class="block text-sm mb-1.5 text-gray-300">Телефон</label>
                <input type="tel" id="phone" required placeholder="+7 (___) ___-__-__"
                       class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-yellow-400">
            </div>

            <div>
                <label class="block text-sm mb-1.5 text-gray-300">Сообщение</label>
                <textarea id="message" rows="4" required placeholder="Напишите ваш вопрос или комментарий"
                          class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-yellow-400"></textarea>
            </div>

            <div>
                <label class="block text-sm mb-1.5 text-gray-300">Откуда узнали о нас?</label>
                <select id="source" class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-yellow-400">
                    <option value="">Выберите</option>
                    <option value="Сторис">Сторис</option>
                    <option value="Пост">Пост</option>
                    <option value="Рекомендация">Рекомендация</option>
                    <option value="Другое">Другое</option>
                </select>
            </div>

            <button type="submit"
                    class="btn-yellow w-full py-3.5 rounded-2xl text-lg mt-2 flex items-center justify-center gap-2">
                <i class="fas fa-paper-plane"></i>
                <span>Отправить сообщение</span>
            </button>
        </form>

        <div id="successMessage" class="hidden mt-6 p-4 bg-green-900/30 border border-green-600 rounded-2xl text-center text-green-400">
            Спасибо! Ваше сообщение отправлено. Мы свяжемся с вами в ближайшее время.
        </div>
    </div>

    <!-- Футер -->
    <div class="border-t border-gray-800 py-6 text-center text-sm text-gray-400">
        <p>Монтажников 17А стр.1, Тюмень</p>
        <p class="mt-1">absauto72@gmail.com</p>
    </div>

    <script>
        document.getElementById('contactForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                message: document.getElementById('message').value,
                source: document.getElementById('source').value || 'Не указано',
                date: new Date().toLocaleString('ru-RU')
            };

            // === Твоя ссылка на Google Таблицу ===
            const scriptURL = 'https://script.google.com/macros/s/AKfycbwiKgYNukMbQnjpNhaKPVpbjqBMA7U2JceLPkBghg1fFX7thFZVSovbHmCngMb5xeMH/exec';

            try {
                await fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                // Показываем сообщение об успехе
                document.getElementById('contactForm').classList.add('hidden');
                document.getElementById('successMessage').classList.remove('hidden');

            } catch (error) {
                alert('Произошла ошибка. Попробуйте ещё раз или позвоните нам.');
            }
        });
    </script>
</body>
</html>
